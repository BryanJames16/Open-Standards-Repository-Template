name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repository Checking
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, pinned to its full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace and commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make check

  # Lint Markdown Files
  # Make sure to add a repository variable named `MARKDOWN_LINT_TARGET` to specify the target directory for linting (normally on docs/specifications). If not set, it defaults to `docs`.
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MARKDOWN_LINT_TARGET: ${{ vars.MARKDOWN_LINT_TARGET || 'docs' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Lint Markdown
        run: make lint-markdown
